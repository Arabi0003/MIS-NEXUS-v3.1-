/* ============================================================

   PREMIUM INSTITUTIONAL INTERFACE

/* ============================================================
   DESIGN TOKENS
   ============================================================ */

:root {

  --bg:
    #06130e;

  --bg-deep:
    #020806;

  --surface:
    rgba(10, 29, 21, .72);

  --surface-solid:
    #0b2017;

  --surface-soft:
    rgba(255,255,255,.045);

  --surface-hover:
    rgba(255,255,255,.075);

  --text:
    #f7fffb;

  --text-soft:
    #dcebe4;

  --muted:
    #91a99e;

  --muted-soft:
    #62776c;

  --line:
    rgba(255,255,255,.105);

  --line-strong:
    rgba(255,255,255,.17);


  /* CLEAN INSTITUTIONAL EMERALD */

  --emerald:
    #16a36f;

  --emerald-clean:
    #18b77d;

  --emerald-light:
    #58e0ae;

  --emerald-dark:
    #08724c;

  --emerald-glow:
    rgba(24,183,125,.30);


  /* VIBE SILVER */

  --silver:
    #d7dee5;

  --silver-light:
    #f7fafc;

  --silver-mid:
    #aeb8c3;

  --silver-dark:
    #687582;

  --silver-glow:
    rgba(215,222,229,.26);


  --accent:
    var(--emerald-clean);

  --accent-light:
    var(--emerald-light);

  --accent-dark:
    var(--emerald-dark);

  --accent-glow:
    var(--emerald-glow);


  --danger:
    #ff647c;

  --warning:
    #ffc15c;

  --success:
    #35d69a;


  --radius-xl:
    36px;

  --radius-lg:
    28px;

  --radius-md:
    20px;

  --radius-sm:
    14px;


  --shadow-xl:
    0 45px 120px
    rgba(0,0,0,.56);

  --shadow-lg:
    0 28px 70px
    rgba(0,0,0,.42);

  --shadow-md:
    0 16px 40px
    rgba(0,0,0,.30);


  --transition:
    280ms
    cubic-bezier(.2,.8,.2,1);

}


/* ============================================================
   SILVER THEME
   ============================================================ */

html[data-theme="silver"] {

  --bg:
    #171b20;

  --bg-deep:
    #090c10;

  --surface:
    rgba(31,36,43,.76);

  --surface-solid:
    #20252b;

  --surface-soft:
    rgba(255,255,255,.055);

  --surface-hover:
    rgba(255,255,255,.095);

  --text:
    #fbfdff;

  --text-soft:
    #e3e8ed;

  --muted:
    #a5afb9;

  --muted-soft:
    #727d88;

  --line:
    rgba(255,255,255,.12);

  --line-strong:
    rgba(255,255,255,.20);

  --accent:
    #d7dee5;

  --accent-light:
    #ffffff;

  --accent-dark:
    #7d8995;

  --accent-glow:
    rgba(215,222,229,.25);

}


/* ============================================================
   EMERALD THEME
   ============================================================ */

html[data-theme="emerald"] {

  --bg:
    #061a12;

  --bg-deep:
    #020b07;

  --surface:
    rgba(8,35,24,.78);

  --surface-solid:
    #0a2419;

  --surface-soft:
    rgba(24,183,125,.055);

  --surface-hover:
    rgba(24,183,125,.095);

  --accent:
    #18b77d;

  --accent-light:
    #64e5b4;

  --accent-dark:
    #08724c;

  --accent-glow:
    rgba(24,183,125,.32);

}


/* ============================================================
   MIDNIGHT
   ============================================================ */

html[data-theme="midnight"] {

  --bg:
    #07111f;

  --bg-deep:
    #020712;

  --surface:
    rgba(12,24,40,.78);

  --surface-solid:
    #0c1828;

  --accent:
    #4d8dff;

  --accent-light:
    #82b9ff;

  --accent-dark:
    #235dc2;

  --accent-glow:
    rgba(77,141,255,.30);

}


/* ============================================================
   ROYAL
   ============================================================ */

html[data-theme="royal"] {

  --bg:
    #11091d;

  --bg-deep:
    #06030b;

  --surface:
    rgba(25,16,39,.78);

  --surface-solid:
    #191027;

  --accent:
    #a97bff;

  --accent-light:
    #d4b8ff;

  --accent-dark:
    #7041c7;

  --accent-glow:
    rgba(169,123,255,.30);

}


/* ============================================================
   SAPPHIRE
   ============================================================ */

html[data-theme="sapphire"] {

  --bg:
    #06141f;

  --bg-deep:
    #020a11;

  --surface:
    rgba(10,30,45,.78);

  --surface-solid:
    #0a1e2d;

  --accent:
    #42c2ff;

  --accent-light:
    #8bddff;

  --accent-dark:
    #1676ad;

  --accent-glow:
    rgba(66,194,255,.30);

}


/* ============================================================
   LIGHT
   ============================================================ */

html[data-theme="light"] {

  --bg:
    #f3f6fa;

  --bg-deep:
    #e8edf3;

  --surface:
    rgba(255,255,255,.84);

  --surface-solid:
    #ffffff;

  --surface-soft:
    rgba(20,35,50,.045);

  --surface-hover:
    rgba(20,35,50,.075);

  --text:
    #15202b;

  --text-soft:
    #354555;

  --muted:
    #667687;

  --muted-soft:
    #8794a2;

  --line:
    rgba(20,35,50,.10);

  --line-strong:
    rgba(20,35,50,.16);

  --accent:
    #15966a;

  --accent-light:
    #36bf8b;

  --accent-dark:
    #08724c;

  --accent-glow:
    rgba(21,150,106,.18);

}


/* ============================================================
   RESET
   ============================================================ */

* {

  box-sizing:
    border-box;

  margin:
    0;

  padding:
    0;

  -webkit-tap-highlight-color:
    transparent;

}


html {

  width:
    100%;

  height:
    100%;

  background:
    transparent;

  overscroll-behavior:
    none;

}


body {

  width:
    100%;

  min-height:
    100%;

  margin:
    0;

  overflow:
    hidden;

  background:
    transparent;

  color:
    var(--text);

  font-family:
    Inter,
    "SF Pro Display",
    "SF Pro Text",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing:
    antialiased;

  text-rendering:
    optimizeLegibility;

  touch-action:
    manipulation;

}


/* ============================================================
   APPLICATION
   ============================================================ */

#app {

  position:
    fixed;

  inset:
    0;

  width:
    100%;

  height:
    100dvh;

  overflow:
    hidden;

  background:
    transparent;

}


.application {

  position:
    relative;

  width:
    100%;

  height:
    100%;

  overflow:
    hidden;

  isolation:
    isolate;

  background:

    radial-gradient(
      850px 600px
      at 50% -10%,
      var(--accent-glow),
      transparent 70%
    ),

    radial-gradient(
      650px 500px
      at -15% 90%,
      color-mix(
        in srgb,
        var(--accent-light) 8%,
        transparent
      ),
      transparent 70%
    ),

    linear-gradient(
      145deg,
      var(--bg),
      var(--bg-deep)
    );

  transition:
    background 700ms ease;

}


/* ============================================================
   AMBIENT LIGHT
   ============================================================ */

.ambient {

  position:
    absolute;

  inset:
    0;

  overflow:
    hidden;

  pointer-events:
    none;

  z-index:
    0;

}


.ambient::before {

  content:
    "";

  position:
    absolute;

  width:
    55vw;

  height:
    55vw;

  min-width:
    300px;

  min-height:
    300px;

  left:
    50%;

  top:
    30%;

  transform:
    translate(-50%,-50%);

  border-radius:
    50%;

  background:
    radial-gradient(
      circle,
      var(--accent-glow),
      transparent 68%
    );

  filter:
    blur(55px);

  animation:
    ambientPulse
    8s
    ease-in-out
    infinite;

}


@keyframes ambientPulse {

  0%,
  100% {

    transform:
      translate(-50%,-50%)
      scale(.82);

    opacity:
      .65;

  }

  50% {

    transform:
      translate(-50%,-50%)
      scale(1.08);

    opacity:
      1;

  }

}


/* ============================================================
   AMBIENT GRID
   ============================================================ */

.ambient::after {

  content:
    "";

  position:
    absolute;

  inset:
    -50%;

  background:

    linear-gradient(
      rgba(255,255,255,.025)
      1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.025)
      1px,
      transparent 1px
    );

  background-size:
    70px 70px;

  transform:
    perspective(700px)
    rotateX(58deg)
    translateY(25%);

  transform-origin:
    center;

  mask-image:
    linear-gradient(
      to bottom,
      transparent,
      black 35%,
      transparent 85%
    );

  opacity:
    .35;

}


/* ============================================================
   TOP BAR
   ============================================================ */

.appbar {

  position:
    absolute;

  z-index:
    80;

  top:
    0;

  left:
    0;

  right:
    0;

  min-height:
    calc(76px + env(safe-area-inset-top));

  padding:
    calc(12px + env(safe-area-inset-top))
    clamp(15px,4vw,42px)
    10px;

  display:
    flex;

  align-items:
    flex-end;

  justify-content:
    space-between;

  background:

    linear-gradient(
      180deg,
      color-mix(
        in srgb,
        var(--bg-deep) 96%,
        transparent
      ),
      transparent
    );

  pointer-events:
    none;

}


.identity {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  min-width:
    0;

  pointer-events:
    auto;

}


.identity-logo {

  width:
    50px;

  height:
    50px;

  object-fit:
    contain;

  padding:
    4px;

  border-radius:
    16px;

  background:
    rgba(255,255,255,.96);

  box-shadow:

    0 14px 32px
    rgba(0,0,0,.30),

    inset
    0 1px 0
    rgba(255,255,255,.9);

}


.identity-copy {

  min-width:
    0;

}


.identity-name {

  font-size:
    15px;

  line-height:
    1;

  font-weight:
    1000;

  letter-spacing:
    -.055em;

}


.identity-name sup {

  color:
    var(--accent-light);

  font-size:
    7px;

}


.identity-school {

  margin-top:
    5px;

  max-width:
    min(65vw,360px);

  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  color:
    var(--muted);

  font-size:
    7px;

  font-weight:
    850;

  letter-spacing:
    1.25px;

  text-transform:
    uppercase;

}


.header-actions {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  pointer-events:
    auto;

}


.header-button {

  width:
    42px;

  height:
    42px;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid var(--line);

  border-radius:
    14px;

  background:
    var(--surface-soft);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    var(--shadow-md);

  transition:
    transform var(--transition),
    background var(--transition);

}


.header-button:active {

  transform:
    scale(.90);

}


/* ============================================================
   MAIN
   ============================================================ */

.main {

  position:
    relative;

  z-index:
    10;

  width:
    100%;

  height:
    100%;

  padding:
    calc(84px + env(safe-area-inset-top))
    clamp(14px,4vw,42px)
    calc(14px + env(safe-area-inset-bottom));

  display:
    flex;

  flex-direction:
    column;

  overflow:
    hidden;

}


/* ============================================================
   HERO
   ============================================================ */

.hero {

  position:
    relative;

  flex:
    1;

  min-height:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


.hero-stage {

  position:
    relative;

  width:
    min(72vw,520px);

  height:
    min(72vw,520px);

  max-height:
    52vh;

  display:
    grid;

  place-items:
    center;

  perspective:
    1800px;

}


.hero-stage::before {

  content:
    "";

  position:
    absolute;

  width:
    86%;

  height:
    86%;

  border-radius:
    50%;

  background:
    radial-gradient(
      circle,
      var(--accent-glow),
      transparent 67%
    );

  filter:
    blur(35px);

  animation:
    logoAura
    6s
    ease-in-out
    infinite;

}


@keyframes logoAura {

  0%,
  100% {

    transform:
      scale(.84);

    opacity:
      .60;

  }

  50% {

    transform:
      scale(1.12);

    opacity:
      1;

  }

}


/* ============================================================
   ORBIT SYSTEM
   ============================================================ */

.orbit {

  position:
    absolute;

  width:
    88%;

  height:
    88%;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--accent) 32%,
      transparent
    );

  border-radius:
    50%;

  transform:
    rotateX(68deg)
    rotateZ(-15deg);

  box-shadow:
    0 0 65px
    var(--accent-glow);

  animation:
    orbitSpin
    15s
    linear
    infinite;

}


@keyframes orbitSpin {

  to {

    transform:
      rotateX(68deg)
      rotateZ(345deg);

  }

}


.orbit::before {

  content:
    "";

  position:
    absolute;

  inset:
    9%;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:
    50%;

}


.orbit::after {

  content:
    "";

  position:
    absolute;

  width:
    12px;

  height:
    12px;

  left:
    8%;

  top:
    50%;

  transform:
    translateY(-50%);

  border-radius:
    50%;

  background:
    var(--accent-light);

  box-shadow:
    0 0 25px
    var(--accent-light);

}


/* ============================================================
   LOGO CONTAINER
   ============================================================ */

.logo-depth {

  position:
    relative;

  width:
    min(58vw,390px);

  height:
    min(58vw,390px);

  display:
    grid;

  place-items:
    center;

  transform-style:
    preserve-3d;

  animation:
    logoFloat
    7s
    cubic-bezier(.2,.75,.18,1)
    infinite;

}


@keyframes logoFloat {

  0%,
  100% {

    transform:
      rotateX(0deg)
      rotateY(-12deg)
      rotateZ(-2deg)
      translateY(5px)
      scale(.97);

  }

  22% {

    transform:
      rotateX(11deg)
      rotateY(42deg)
      rotateZ(1deg)
      translateY(-8px)
      scale(1);

  }

  48% {

    transform:
      rotateX(-7deg)
      rotateY(125deg)
      rotateZ(-2deg)
      translateY(2px)
      scale(1.04);

  }

  70% {

    transform:
      rotateX(8deg)
      rotateY(225deg)
      rotateZ(2deg)
      translateY(-7px)
      scale(1.02);

  }

  88% {

    transform:
      rotateX(-5deg)
      rotateY(320deg)
      rotateZ(-1deg)
      translateY(0)
      scale(1);

  }

}


.logo-depth::before {

  content:
    "";

  position:
    absolute;

  inset:
    7%;

  border-radius:
    30%;

  background:
    linear-gradient(
      145deg,
      color-mix(
        in srgb,
        var(--accent) 45%,
        transparent
      ),
      transparent 65%
    );

  transform:
    translateZ(-45px)
    scale(.96);

  filter:
    blur(14px);

  opacity:
    .65;

}


.logo-depth::after {

  content:
    "";

  position:
    absolute;

  left:
    14%;

  right:
    14%;

  bottom:
    -7%;

  height:
    15%;

  border-radius:
    50%;

  background:
    var(--accent);

  filter:
    blur(18px);

  opacity:
    .22;

  transform:
    rotateX(76deg);

}


.hero-logo {

  position:
    relative;

  z-index:
    5;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  padding:
    17px;

  border:
    1px solid
    rgba(255,255,255,.16);

  border-radius:
    clamp(36px,8vw,64px);

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.025)
    );

  box-shadow:

    0 48px 110px
    rgba(0,0,0,.55),

    0 18px 38px
    rgba(0,0,0,.28),

    inset
    0 1px 0
    rgba(255,255,255,.20);

  transform:
    translateZ(35px);

}


/* ============================================================
   AUDIO CONTROL
   ============================================================ */

.audio-control {

  position:
    absolute;

  z-index:
    30;

  left:
    50%;

  bottom:
    -16px;

  transform:
    translateX(-50%);

  min-width:
    126px;

  height:
    31px;

  padding:
    0 11px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    7px;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--accent) 30%,
      var(--line)
    );

  border-radius:
    999px;

  background:
    color-mix(
      in srgb,
      var(--surface-solid) 88%,
      transparent
    );

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  color:
    var(--text-soft);

  font-size:
    7px;

  font-weight:
    950;

  letter-spacing:
    1px;

  text-transform:
    uppercase;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.25);

}


.audio-dot {

  width:
    7px;

  height:
    7px;

  border-radius:
    50%;

  background:
    var(--accent);

  box-shadow:
    0 0 13px
    var(--accent);

}


.audio-control.playing
.audio-dot {

  animation:
    audioPulse
    1.1s
    ease-in-out
    infinite;

}


@keyframes audioPulse {

  0%,
  100% {

    transform:
      scale(.75);

    opacity:
      .55;

  }

  50% {

    transform:
      scale(1.25);

    opacity:
      1;

  }

}


/* ============================================================
   ACCESS GRID
   ============================================================ */

.access {

  width:
    100%;

  max-width:
    1180px;

  margin:
    0 auto;

}


.access-header {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 4px 10px;

}


.access-title {

  font-size:
    12px;

  font-weight:
    950;

  letter-spacing:
    -.025em;

}


.access-meta {

  color:
    var(--muted-soft);

  font-size:
    7px;

  font-weight:
    850;

  letter-spacing:
    1px;

  text-transform:
    uppercase;

}


.app-grid {

  display:
    grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:
    clamp(8px,2vw,14px);

}


.app-card {

  position:
    relative;

  min-width:
    0;

  height:
    clamp(108px,17vw,148px);

  padding:
    clamp(12px,2.5vw,17px);

  display:
    flex;

  flex-direction:
    column;

  justify-content:
    space-between;

  overflow:
    hidden;

  text-align:
    left;

  border:
    1px solid
    var(--line);

  border-radius:
    clamp(22px,4vw,30px);

  background:

    linear-gradient(
      150deg,
      color-mix(
        in srgb,
        var(--icon-color) 9%,
        var(--surface-solid)
      ),
      var(--surface)
    );

  box-shadow:
    var(--shadow-lg);

  transform:
    translateZ(0);

  transition:
    transform var(--transition),
    border-color var(--transition),
    box-shadow var(--transition);

}


.app-card:hover {

  transform:
    translateY(-5px);

  border-color:
    color-mix(
      in srgb,
      var(--icon-color) 38%,
      var(--line)
    );

  box-shadow:
    0 35px 75px
    rgba(0,0,0,.42);

}


.app-card:active {

  transform:
    translateY(3px)
    scale(.965);

}


/* ============================================================
   3D ICON
   ============================================================ */

.app-icon {

  position:
    relative;

  width:
    clamp(55px,12vw,74px);

  height:
    clamp(55px,12vw,74px);

  display:
    grid;

  place-items:
    center;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--icon-color) 34%,
      var(--line)
    );

  border-radius:
    clamp(17px,3.5vw,23px);

  background:

    linear-gradient(
      145deg,
      color-mix(
        in srgb,
        var(--icon-color) 20%,
        var(--surface-solid)
      ),
      var(--surface-solid)
    );

  box-shadow:

    0 14px 25px
    rgba(0,0,0,.32),

    inset
    0 1px 0
    rgba(255,255,255,.15),

    inset
    0 -8px 18px
    rgba(0,0,0,.12);

  transform:
    perspective(700px)
    rotateX(5deg)
    rotateY(-7deg);

  transition:
    transform var(--transition);

}


.app-card:hover
.app-icon {

  transform:
    perspective(700px)
    rotateX(0)
    rotateY(0)
    translateZ(12px)
    scale(1.04);

}


.app-icon::before {

  content:
    "";

  position:
    absolute;

  inset:
    0;

  border-radius:
    inherit;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.17),
      transparent 35%
    );

  pointer-events:
    none;

}


.app-icon::after {

  content:
    "";

  position:
    absolute;

  left:
    15%;

  right:
    15%;

  bottom:
    -10px;

  height:
    13px;

  border-radius:
    50%;

  background:
    var(--icon-color);

  opacity:
    .20;

  filter:
    blur(8px);

}


.app-icon svg {

  position:
    relative;

  z-index:
    2;

  width:
    clamp(29px,7vw,41px);

  height:
    clamp(29px,7vw,41px);

  fill:
    none;

  stroke:
    currentColor;

  stroke-width:
    1.55;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

  color:
    var(--icon-color);

  filter:
    drop-shadow(
      0 5px 8px
      color-mix(
        in srgb,
        var(--icon-color) 45%,
        transparent
      )
    );

}


.app-name {

  display:
    block;

  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  font-size:
    clamp(9px,2.1vw,12px);

  font-weight:
    950;

}


.app-desc {

  display:
    block;

  margin-top:
    4px;

  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  color:
    var(--muted);

  font-size:
    clamp(6px,1.55vw,8px);

}


/* ============================================================
   LOADING OVERLAY
   ============================================================ */

.loading {

  position:
    fixed;

  inset:
    0;

  z-index:
    300;

  display:
    grid;

  place-items:
    center;

  background:
    color-mix(
      in srgb,
      var(--bg-deep) 92%,
      transparent
    );

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  opacity:
    0;

  visibility:
    hidden;

  transition:
    opacity .3s ease,
    visibility .3s ease;

}


.loading.active {

  opacity:
    1;

  visibility:
    visible;

}


.loading-card {

  width:
    min(86vw,370px);

  padding:
    32px 24px;

  text-align:
    center;

  border:
    1px solid
    var(--line);

    32px;

  background:
    var(--surface-solid);

  box-shadow:
    var(--shadow-xl);

}


.loading-logo {

  width:
    100px;

  height:
    100px;

  margin:
    0 auto 22px;

  padding:
    10px;

  object-fit:
    contain;

  border-radius:
    28px;

  background:
    #fff;

  box-shadow:
    0 22px 55px
    rgba(0,0,0,.38);

  animation:
    loadingLogo
    1.8s
    ease-in-out
    infinite;

}


@keyframes loadingLogo {

  0%,
  100% {

    transform:
      rotateY(0)
      scale(.94);

  }

  50% {

    transform:
      rotateY(180deg)
      scale(1.04);

  }

}


/* ============================================================
   INTRO
   ============================================================ */

.intro {

  position:
    fixed;

  inset:
    0;

  z-index:
    500;

  display:
    grid;

  place-items:
    center;

  overflow:
    hidden;

  background:
    var(--bg-deep);

  transition:
    opacity .8s ease,
    visibility .8s ease;

}


.intro.finished {

  opacity:
    0;

  visibility:
    hidden;

  pointer-events:
    none;

}


.intro-content {

  position:
    relative;

  z-index:
    3;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  width:
    100%;

  height:
    100%;

}


.intro-logo {

  width:
    min(64vw,340px);

  height:
    min(64vw,340px);

  object-fit:
    contain;

  padding:
    17px;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:
    38px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 50px 120px
    rgba(0,0,0,.58);

  animation:
    introLogo
    5s
    cubic-bezier(.18,.78,.16,1)
    infinite;

}


@keyframes introLogo {

  0% {

    transform:
      rotateX(-8deg)
      rotateY(-20deg)
      rotateZ(-2deg)
      scale(.90);

  }

  25% {

    transform:
      rotateX(14deg)
      rotateY(70deg)
      rotateZ(3deg)
      scale(1);

  }

  50% {

    transform:
      rotateX(-10deg)
      rotateY(180deg)
      rotateZ(-2deg)
      scale(1.05);

  }

  75% {

    transform:
      rotateX(12deg)
      rotateY(285deg)
      rotateZ(2deg)
      scale(1);

  }

  100% {

    transform:
      rotateX(-8deg)
      rotateY(342deg)
      rotateZ(-2deg)
      scale(.90);

  }

}


.intro-title {

  font-size:

}

}


.intro-label {

  font-size:
    7px;

  font-weight:
    950;

  letter-spacing:
    2px;

  text-transform:
    uppercase;

}


/* ============================================================
   THEME DRAWER
   ============================================================ */

.theme-drawer {

  position:
    fixed;

  z-index:
    250;

  top:
    calc(76px + env(safe-area-inset-top));

  right:
    12px;

  width:
    min(340px,calc(100vw - 24px));

  padding:
    15px;

  border:
    1px solid
    var(--line);

  border-radius:
    25px;

  background:
    var(--surface-solid);

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

  box-shadow:
    var(--shadow-xl);

  opacity:
    0;

  visibility:
    hidden;

  pointer-events:
    none;

  transform:
    translateY(-12px)
    scale(.97);

  transition:
    opacity var(--transition),
    visibility var(--transition),
    transform var(--transition);

}


.theme-drawer.open {

  opacity:
    1;

  visibility:
    visible;

  pointer-events:
    auto;

  transform:
    translateY(0)
    scale(1);

}


.theme-heading {

  margin-bottom:
    12px;

  color:
    var(--muted);

  font-size:
    8px;

  font-weight:
    950;

  letter-spacing:
    1.4px;

  text-transform:
    uppercase;

}


.theme-grid {

  display:
    grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:
    8px;

}


.theme {

  position:
    relative;

  height:
    68px;

  border:
    1px solid
    var(--line);

  border-radius:

  background:
    var(--surface-soft);

  transition:

}


.theme:active {

    scale(.94);

}


.theme.active {

  border-color:
    var(--theme-color);

  box-shadow:
    0 0 24px
    color-mix(
      in srgb,
      var(--theme-color) 22%,
      transparent
    );

}


.theme-color {

  position:
    absolute;

  left:
    50%;

  top:
    39%;

  width:
    27px;

  height:
    27px;

  transform:
    translate(-50%,-50%);

  border-radius:
    50%;

  background:
    var(--theme-color);

  box-shadow:
    0 0 20px
    color-mix(
      in srgb,
      var(--theme-color) 50%,

    );

}


.theme-label {

  position:
    absolute;

  left:
    0;

  right:
    0;

  bottom:
    7px;

  color:

.mn-smart-read {
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-soft);
  color: var(--text);
  font-size: 6px;
  font-weight: 950;
  letter-spacing: .55px;
  cursor: pointer;
}

.mn-smart-list {
  overflow: auto;
  overscroll-behavior: contain;
  padding: 9px;
  display: grid;
  gap: 7px;
}

.mn-smart-item {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface-soft);
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.mn-smart-item:hover {
  background: var(--surface-hover);
}

.mn-smart-item:active {
  transform: scale(.985);
}

.mn-smart-item.unread::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 15px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #d95568;
}

.mn-smart-icon {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-solid);
  color: var(--accent);
}

.mn-smart-icon svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mn-smart-copy {
  flex: 1;
  min-width: 0;
}

.mn-smart-item-title {
  font-size: 10px;
  font-weight: 950;
  line-height: 1.25;
}

.mn-smart-body {
  margin-top: 4px;
  color: var(--muted);
  font-size: 8px;
  line-height: 1.45;
}

.mn-smart-time {
  margin-top: 6px;
  color: var(--muted-soft);
  font-size: 5.5px;
  font-weight: 900;
  letter-spacing: .7px;
  text-transform: uppercase;
}

.mn-smart-empty {
  padding: 45px 15px;
  color: var(--muted);
  text-align: center;
  font-size: 9px;
}

.mn-smart-empty strong {
  display: block;
  margin-bottom: 3px;
  color: var(--text);
  font-size: 12px;
}

@media (max-width: 430px) {
  .smart-app-footer {
    padding-left: 9px;
    padding-right: 9px;
  }

  .store-badge {
    min-width: 0;
    flex: 1;
  }
}

@media (min-width: 800px) {
  .smart-app-footer {
    padding-left: 18px;
    padding-right: 18px;
  }
}

@media (display-mode: standalone) {
  .smart-app-footer {
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
}

</style>

<script>

"use strict";


/* ============================================================
   APPLICATION CONFIGURATION
   ============================================================ */

const CONFIG = {

  storageTheme:
    "mis-nexus-theme",

  storageAudio:
    "mis-nexus-audio",

  storageNotifications:
    "mis-nexus-notifications",

  defaultTheme:
    "silver",

  introDuration:
    5200,

  loadingDelay:
    850,

  routes: {

    teachers:
      "teachers.html",

    students:
      "students.html",

    parents:
      "parents.html",

    boarders:
      "boarders.html",

    staff:
      "staff.html",

    classes:
      "classes.html"

  }

};


/* ============================================================
   DOM
   ============================================================ */

const DOM = {

  html:
    document.documentElement,

  body:
    document.body,

  application:
    document.getElementById(
      "application"
    ),

  themeButton:
    document.getElementById(
      "themeButton"
    ),

  notificationLink:
    document.getElementById(
      "notificationLink"
    ),

  notificationBadge:
    document.getElementById(
      "notificationBadge"
    ),

  themeDrawer:
    document.getElementById(
      "themeDrawer"
    ),

  themes:
    [
      ...document.querySelectorAll(
        ".theme"
      )
    ],

  audio:
    document.getElementById(
      "welcomeAudio"
    ),

  audioControl:
    document.getElementById(
      "audioControl"
    ),

  audioLabel:
    document.getElementById(
      "audioLabel"
    ),

  audioDot:
    document.getElementById(
      "audioDot"
    ),

  intro:
    document.getElementById(
      "intro"
    ),

  loading:
    document.getElementById(
      "loading"
    ),

  accessCards:
    [
      ...document.querySelectorAll(
        ".app-card"
      )
    ],

  themeColor:
    document.getElementById(
      "themeColor"
    )

};


/* ============================================================
   STATE
   ============================================================ */

const state = {

  theme:
    (function(){
      const saved = localStorage.getItem(CONFIG.storageTheme);
      const migrated = {
        midnight: "navy",
        emerald: "navy",
        royal: "navy",
        sapphire: "navy",
        silver: "silver",
        light: "light",
        navy: "navy"
      };
      return migrated[saved] || CONFIG.defaultTheme;
    })(),

  audioEnabled:
    localStorage.getItem(
      CONFIG.storageAudio
    ) !== "off",

  themeOpen:
    false,

  introFinished:
    false,

  navigating:
    false

};


/* ============================================================
   THEME ENGINE
   ============================================================ */

function applyTheme(
  themeName
) {

  const theme =
    CONFIG.themes?.[themeName];

  DOM.html.dataset.theme =
    themeName;

  state.theme =
    themeName;

  localStorage.setItem(
    CONFIG.storageTheme,
    themeName
  );

  DOM.themes.forEach(
    button => {

      button.classList.toggle(
        "active",
        button.dataset.theme ===
        themeName
      );

    }
  );

}


/* ============================================================
   THEME DRAWER
   ============================================================ */

function toggleThemeDrawer(
  force
) {

  state.themeOpen =
    typeof force ===
    "boolean"
      ? force
      : !state.themeOpen;

  DOM.themeDrawer.classList.toggle(
    "open",
    state.themeOpen
  );

  DOM.themeDrawer.setAttribute(
    "aria-hidden",
    String(
      !state.themeOpen
    )
  );

}


/* ============================================================
   AUDIO UI
   ============================================================ */

function updateAudioUI(
  playing
) {

  DOM.audioControl.classList.toggle(
    "playing",
    playing
  );

  DOM.audioLabel.textContent =
    playing
      ? "AUDIO PLAYING"
      : "AUDIO OFF";

}


/* ============================================================
   AUDIO PLAYBACK
   ============================================================ */

async function startAudio() {

  if (
    !state.audioEnabled ||
    !DOM.audio
  ) {

    updateAudioUI(
      false
    );

    return false;

  }


  try {

    DOM.audio.muted =
      false;

    await DOM.audio.play();

    updateAudioUI(
      true
    );

    return true;

  } catch (
    error
  ) {

    /*
      Browser autoplay policy may reject
      unmuted playback before interaction.

      We do not pretend this can be bypassed.
      Playback is retried automatically after
      legitimate user interaction.
    */

    updateAudioUI(
      false
    );

    return false;

  }

}


/* ============================================================
   AUDIO RETRY
   ============================================================ */

function installAudioRetry() {

  const retry =
    () => {

      if (
        state.audioEnabled &&
        DOM.audio.paused
      ) {

        void startAudio();

      }

    };


  [
    "pointerdown",
    "touchstart",
    "keydown",
    "click"
  ].forEach(
    eventName => {

      document.addEventListener(
        eventName,
        retry,
        {
          passive:
            true
        }
      );

    }
  );

}


/* ============================================================
   AUDIO CONTROL
   ============================================================ */

function initializeAudio() {

  DOM.audioControl.addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      if (
        DOM.audio.paused
      ) {

        state.audioEnabled =
          true;

        localStorage.setItem(
          CONFIG.storageAudio,
          "on"
        );

        await startAudio();

        return;

      }


      DOM.audio.pause();

      state.audioEnabled =
        false;

      localStorage.setItem(
        CONFIG.storageAudio,
        "off"
      );

      updateAudioUI(
        false
      );

    }
  );


  DOM.audio.addEventListener(
    "play",
    () => {

      updateAudioUI(
        true
      );

    }
  );


  DOM.audio.addEventListener(
    "pause",
    () => {

      updateAudioUI(
        false
      );

    }
  );


  DOM.audio.addEventListener(
    "error",
    () => {

      updateAudioUI(
        false
      );

    }
  );


  installAudioRetry();

  void startAudio();

}


/* ============================================================
   NOTIFICATION ENGINE
   ============================================================ */

const DEFAULT_NOTIFICATIONS = [
  {
    id: "mis-nexus-welcome",
    title: "MIS-NEXUS™ is ready",
    body: "Your institutional access hub is available.",
    type: "system",
    time: "Just now",
    unread: true
  },
  {
    id: "mis-nexus-updates",
    title: "School updates",
    body: "New announcements can appear here whenever they are published.",
    type: "announcement",
    time: "Today",
    unread: true
  }
];

function notificationRead() {
  try {
    const raw = localStorage.getItem(CONFIG.storageNotifications);
    if (!raw) return DEFAULT_NOTIFICATIONS.map(item => ({ ...item }));
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return DEFAULT_NOTIFICATIONS.map(item => ({ ...item }));
    return parsed.filter(item => item && typeof item === "object");
  } catch (error) {
    return DEFAULT_NOTIFICATIONS.map(item => ({ ...item }));
  }
}

function notificationWrite(items) {
  try {
    localStorage.setItem(
      CONFIG.storageNotifications,
      JSON.stringify(items)
    );
  } catch (error) {
    /* Storage may be unavailable; the app remains usable. */
  }
}

function notificationCount() {
  return notificationRead().reduce(
    (count, item) => count + (item.unread ? 1 : 0),
    0
  );
}

function updateNotificationBadge() {
  if (!DOM.notificationBadge) return;

  const count = notificationCount();

  if (count <= 0) {
    DOM.notificationBadge.classList.remove("visible");
    DOM.notificationBadge.removeAttribute("data-count");
    DOM.notificationBadge.setAttribute("aria-hidden", "true");
    return;
  }

  DOM.notificationBadge.classList.add("visible");
  DOM.notificationBadge.dataset.count = count > 99 ? "99+" : String(count);
  DOM.notificationBadge.setAttribute("aria-hidden", "false");
}

function markNotificationsRead() {
  const items = notificationRead().map(item => ({
    ...item,
    unread: false
  }));

  notificationWrite(items);
  updateNotificationBadge();
}

function pushNotification(title, body, type = "announcement") {
  const items = notificationRead();
  const item = {
    id: `notice-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    title: String(title || "New notification"),
    body: String(body || ""),
    type: String(type || "announcement"),
    time: "Just now",
    unread: true
  };

  items.unshift(item);
  notificationWrite(items.slice(0, 100));
  updateNotificationBadge();
  return item;
}

function initializeNotifications() {
  updateNotificationBadge();

  DOM.notificationLink?.addEventListener("click", () => {
    try {
      localStorage.setItem("mis-nexus-last-notifications", String(Date.now()));
    } catch (error) {
      /* Ignore storage failures. */
    }
  });

  window.addEventListener("storage", event => {
    if (event.key === CONFIG.storageNotifications) {
      updateNotificationBadge();
    }
  });
}

/* ============================================================
   ACCESS NAVIGATION
   ============================================================ */

async function navigateTo(
  route
) {

  if (
    state.navigating
  ) {

    return;

  }

  if (
    !route
  ) {

    return;

  }

  state.navigating =
    true;


  DOM.loading.classList.add(
    "active"
  );

  DOM.loading.setAttribute(
    "aria-hidden",
    "false"
  );


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        CONFIG.loadingDelay
      )
  );


  window.location.href =
    route;

}


/* ============================================================
   ACCESS INITIALIZATION
   ============================================================ */

function initializeAccess() {

  DOM.accessCards.forEach(
    card => {

      card.addEventListener(
        "click",
        () => {

          const route =
            card.dataset.route;

          void navigateTo(
            route
          );

        }
      );

    }
  );

}


/* ============================================================
   THEME INITIALIZATION
   ============================================================ */

function initializeThemes() {

  applyTheme(
    state.theme
  );


  DOM.themeButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      toggleThemeDrawer();

    }
  );


  DOM.themes.forEach(
    button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          applyTheme(
            button.dataset.theme
          );

          toggleThemeDrawer(
            false
          );

        }
      );

    }
  );


  document.addEventListener(
    "pointerdown",
    event => {

      if (
        state.themeOpen &&
        !DOM.themeDrawer.contains(
          event.target
        ) &&
        !DOM.themeButton.contains(
          event.target
        )
      ) {

        toggleThemeDrawer(
          false
        );

      }

    },
    {
      passive:
        true
    }
  );

}


/* ============================================================
   INTRO
   ============================================================ */

function initializeIntro() {

  window.setTimeout(
    () => {

      state.introFinished =
        true;

      DOM.intro.classList.add(
        "finished"
      );

      DOM.intro.setAttribute(
        "aria-hidden",
        "true"
      );

    },
    CONFIG.introDuration
  );

}


/* ============================================================
   KEYBOARD
   ============================================================ */

function initializeKeyboard() {

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        toggleThemeDrawer(
          false
        );

      }


      if (
        event.key.toLowerCase() ===
        "t"
      ) {

        toggleThemeDrawer();

      }


      if (
        event.key.toLowerCase() ===
        "m"
      ) {

        if (
          DOM.audio.paused
        ) {

          state.audioEnabled =
            true;

          void startAudio();

        } else {

          DOM.audio.pause();

        }

      }

    }
  );

}


/* ============================================================
   PERFORMANCE
   ============================================================ */

function initializePerformance() {

  const images =
    [
      "logo.png",
      "institution.png",
      "secure.png"
    ];


  images.forEach(
    source => {

      const image =
        new Image();

      image.decoding =
        "async";

      image.src =
        source;

    }
  );

}


/* ============================================================
   SERVICE WORKER
   ============================================================ */

function initializeServiceWorker() {

  if (
    !("serviceWorker" in navigator)
  ) {

    return;

  }


  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js",
          {
            scope:
              "./"
          }
        )
        .catch(
          () => {

            /*
              Application remains functional
              when SW is not deployed.
            */

          }
        );

    }
  );

}


/* ============================================================
   APPLICATION BOOT
   ============================================================ */

function bootstrap() {

  initializeThemes();

  initializeAudio();

  initializeNotifications();

  initializeAccess();

  initializeIntro();

  initializeKeyboard();

  initializePerformance();

  initializeServiceWorker();

}


/* ============================================================
   START
   ============================================================ */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    bootstrap,
    {
      once:
        true
    }
  );

} else {

  bootstrap();

}

const MISNexusTools = Object.freeze({
  clamp(value,min,max){return Math.min(Math.max(Number(value)||0,min),max);},
  normalize(value){return String(value??"").replace(/\s+/g," ").trim();},
  safeNumber(value,fallback=0){const n=Number(value);return Number.isFinite(n)?n:fallback;},
  now(){return Date.now();},
  iso(){return new Date().toISOString();},
  delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));},
  idle(callback,timeout=800){if("requestIdleCallback" in window)return requestIdleCallback(callback,{timeout});return setTimeout(callback,Math.min(timeout,250));},
  frame(callback){return requestAnimationFrame(callback);},
  storage(key,value){try{if(arguments.length>1)localStorage.setItem(key,String(value));return localStorage.getItem(key);}catch{return null;}},
  removeStorage(key){try{localStorage.removeItem(key);}catch{}},
  json(value,fallback=null){try{return JSON.parse(value);}catch{return fallback;}},
  uuid(prefix="mis"){return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;},
  online(){return navigator.onLine;},
  standalone(){return Boolean(matchMedia?.("(display-mode: standalone)")?.matches||navigator.standalone);},
  reducedMotion(){return Boolean(matchMedia?.("(prefers-reduced-motion: reduce)")?.matches);},
  viewport(){return {width:innerWidth,height:innerHeight,dpr:devicePixelRatio||1};}
});

<script>
/* ============================================================
   MIS-NEXUS™ SMART APP RUNTIME
   ============================================================ */
(() => {
  "use strict";

  const APP = {
    notificationKey: "mis-nexus-notifications",
    themeKey: "mis-nexus-theme",
    installKey: "mis-nexus-install-dismissed",
    maxNotifications: 100,
    themes: ["silver", "navy", "light"]
  };

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const safeJSON = (value, fallback) => {
    try {
      return JSON.parse(value);
    } catch {
      return fallback;
    }
  };

  const escapeHTML = value => String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  const readNotifications = () => {
    const raw = localStorage.getItem(APP.notificationKey);
    if (!raw) return [
      {
        id: "mis-nexus-welcome",
        title: "MIS-NEXUS™ is ready",
        body: "Your institutional access hub is available.",
        type: "system",
        time: "Just now",
        unread: true,
        createdAt: Date.now()
      },
      {
        id: "mis-nexus-updates",
        title: "School updates",
        body: "New announcements can appear here whenever they are published.",
        type: "announcement",
        time: "Today",
        unread: true,
        createdAt: Date.now() - 1000
      }
    ];
    const parsed = safeJSON(raw, []);
    return Array.isArray(parsed) ? parsed : [];
  };

  const writeNotifications = items => {
    const normalized = items
      .filter(item => item && typeof item === "object")
      .slice(0, APP.maxNotifications);
    try {
      localStorage.setItem(APP.notificationKey, JSON.stringify(normalized));
    } catch {}
    updateBadge();
    window.dispatchEvent(new CustomEvent("mis-nexus-notifications-updated", {
      detail: normalized
    }));
  };

  const unreadCount = () => readNotifications().filter(item => item.unread).length;

  const updateBadge = () => {
    const badge = $("#notificationBadge");
    if (!badge) return;
    const count = unreadCount();
    badge.classList.toggle("visible", count > 0);
    badge.dataset.count = count > 99 ? "99+" : String(count);
    badge.setAttribute("aria-hidden", count > 0 ? "false" : "true");
  };

  const markNotificationRead = id => {
    writeNotifications(readNotifications().map(item =>
      item.id === id ? { ...item, unread: false } : item
    ));
  };

  const markAllNotificationsRead = () => {
    writeNotifications(readNotifications().map(item => ({ ...item, unread: false })));
  };

  const addNotification = (title, body, type = "announcement") => {
    const item = {
      id: `notice-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
      title: String(title || "New notification"),
      body: String(body || ""),
      type: String(type || "announcement"),
      time: "Just now",
      unread: true,
      createdAt: Date.now()
    };
    writeNotifications([item, ...readNotifications()]);
    return item;
  };

  const iconFor = type => {
    if (type === "announcement") return `<svg viewBox="0 0 24 24"><path d="M4 11h5l8-4v10l-8-4H4z"></path><path d="M9 15l1.5 5"></path></svg>`;
    if (type === "attendance") return `<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"></path><path d="m8 12 2.2 2.2L16 8.5"></path></svg>`;
    if (type === "classes") return `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg>`;
    return `<svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>`;
  };

  let overlay = null;
  let isOpen = false;

  const buildOverlay = () => {
    if (overlay) return overlay;

    overlay = document.createElement("div");
    overlay.id = "mnSmartNotificationRoot";
    overlay.innerHTML = `
      <div class="mn-smart-backdrop" data-smart-notification-close></div>
      <section class="mn-smart-panel" role="dialog" aria-modal="true" aria-label="MIS-NEXUS notifications">
        <header class="mn-smart-head">
          <div class="mn-smart-heading">
            <div class="mn-smart-kicker">MIS-NEXUS™ • LIVE UPDATES</div>
            <div class="mn-smart-title">Notifications</div>
          </div>
          <button class="mn-smart-button" type="button" data-smart-read aria-label="Mark all notifications read" title="Mark all read">
            <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg>
          </button>
          <button class="mn-smart-button" type="button" data-smart-notification-close aria-label="Close notifications" title="Close">
            <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg>
          </button>
        </header>
        <div class="mn-smart-summary">
          <span><strong id="mnSmartUnread">0</strong> unread updates</span>
          <button class="mn-smart-read" type="button" data-smart-read>MARK ALL READ</button>
        </div>
        <div class="mn-smart-list" id="mnSmartList" tabindex="0"></div>
      </section>
    `;
    document.body.appendChild(overlay);

    $$('[data-smart-notification-close]', overlay).forEach(button => {
      button.addEventListener("click", closeNotifications);
    });

    $$('[data-smart-read]', overlay).forEach(button => {
      button.addEventListener("click", () => {
        markAllNotificationsRead();
        renderNotifications();
      });
    });

    return overlay;
  };

  const renderNotifications = () => {
    const host = buildOverlay();
    const list = $("#mnSmartList", host);
    const counter = $("#mnSmartUnread", host);
    const items = readNotifications();
    const unread = items.filter(item => item.unread).length;

    counter.textContent = String(unread);

    if (!items.length) {
      list.innerHTML = `<div class="mn-smart-empty"><strong>You're all caught up.</strong>No new notifications right now.</div>`;
      return;
    }

    list.innerHTML = items.map(item => `
      <article class="mn-smart-item ${item.unread ? "unread" : ""}" data-notification-id="${escapeHTML(item.id)}" tabindex="0" role="button">
        <div class="mn-smart-icon">${iconFor(item.type)}</div>
        <div class="mn-smart-copy">
          <div class="mn-smart-item-title">${escapeHTML(item.title)}</div>
          <div class="mn-smart-body">${escapeHTML(item.body)}</div>
          <div class="mn-smart-time">${escapeHTML(item.time || "Update")}</div>
        </div>
      </article>
    `).join("");

    $$(".mn-smart-item", list).forEach(card => {
      const activate = () => {
        markNotificationRead(card.dataset.notificationId);
        renderNotifications();
      };
      card.addEventListener("click", activate);
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });
    });
  };

  function openNotifications() {
    buildOverlay();
    renderNotifications();
    document.documentElement.classList.add("mn-notification-open");
    overlay.classList.add("mn-smart-open");
    isOpen = true;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onNotificationKeydown, true);
  }

  function closeNotifications() {
    if (!overlay || !isOpen) return;
    overlay.classList.remove("mn-smart-open");
    document.documentElement.classList.remove("mn-notification-open");
    isOpen = false;
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onNotificationKeydown, true);
  }

  function onNotificationKeydown(event) {
    if (event.key === "Escape") closeNotifications();
  }

  function toggleNotifications() {
    if (isOpen) closeNotifications();
    else openNotifications();
  }

  /* Capture phase deliberately intercepts the existing notifications.html link. */
  document.addEventListener("click", event => {
    const link = event.target.closest?.('a[href="notifications.html"], #notificationLink, [data-open-notifications]');
    if (!link) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    openNotifications();
  }, true);

  window.addEventListener("storage", event => {
    if (event.key === APP.notificationKey) {
      updateBadge();
      if (isOpen) renderNotifications();
    }
    if (event.key === APP.themeKey) applySupportedTheme();
  });

  window.addEventListener("mis-nexus-notifications-updated", () => {
    updateBadge();
    if (isOpen) renderNotifications();
  });

  const applySupportedTheme = () => {
    let theme = localStorage.getItem(APP.themeKey) || "silver";
    if (!APP.themes.includes(theme)) theme = "silver";
    document.documentElement.dataset.theme = theme;
    const themeButtons = $$(".theme");
    themeButtons.forEach(button => {
      const active = button.dataset.theme === theme;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    const themeColor = $("#themeColor");
    if (themeColor) {
      themeColor.setAttribute("content", theme === "navy" ? "#183f70" : theme === "light" ? "#f7f9fb" : "#d7dee5");
    }
  };

  const installManager = (() => {
    let deferredPrompt = null;
    const button = $("#installAppButton");

    const show = () => {
      if (!button) return;
      button.hidden = false;
    };

    const hide = () => {
      if (!button) return;
      button.hidden = true;
    };

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      show();
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      hide();
      try { localStorage.setItem(APP.installKey, "installed"); } catch {}
    });

    button?.addEventListener("click", async () => {
      if (!deferredPrompt) {
        window.dispatchEvent(new CustomEvent("mis-nexus-install-unavailable"));
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice.catch(() => null);
      deferredPrompt = null;
      hide();
    });

    return Object.freeze({
      show,
      hide,
      available: () => Boolean(deferredPrompt)
    });
  })();

  const storeBadgeManager = () => {
    const play = $("#playStoreBadge");
    const apple = $("#appleStoreBadge");

    const unavailable = platform => {
      if (window.MISNexusTools?.toast) {
        window.MISNexusTools.toast(`${platform} listing will be available when the store release is published.`);
        return;
      }
      const original = document.title;
      document.title = `${platform} release coming soon • ${original}`;
      window.setTimeout(() => { document.title = original; }, 1800);
    };

    play?.addEventListener("click", () => unavailable("Google Play"));
    apple?.addEventListener("click", () => unavailable("Apple App Store"));
  };

  const addToastSystem = () => {
    if (window.MISNexusTools?.toast) return;

    const toast = message => {
      let host = $("#misNexusRuntimeToast");
      if (!host) {
        host = document.createElement("div");
        host.id = "misNexusRuntimeToast";
        host.style.cssText = "position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);z-index:2147482999;opacity:0;transition:.22s ease;pointer-events:none;max-width:min(92vw,420px);padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface-solid);color:var(--text);font:800 9px/1.35 Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 18px 50px rgba(0,0,0,.25);text-align:center";
        document.body.appendChild(host);
      }
      host.textContent = String(message || "");
      host.style.opacity = "1";
      host.style.transform = "translateX(-50%) translateY(0)";
      clearTimeout(host._timer);
      host._timer = setTimeout(() => {
        host.style.opacity = "0";
        host.style.transform = "translateX(-50%) translateY(15px)";
      }, 2200);
    };

    window.MISNexusTools = window.MISNexusTools || {};
    window.MISNexusTools.toast = toast;
  };

  const accessibility = () => {
    document.addEventListener("keydown", event => {
      if (event.key !== "Tab") return;
      document.documentElement.classList.add("keyboard-navigation");
    }, { passive: true });

    document.addEventListener("pointerdown", () => {
      document.documentElement.classList.remove("keyboard-navigation");
    }, { passive: true });
  };

  const footerClock = () => {
    const year = $("#footerYear");
    if (year) year.textContent = String(new Date().getFullYear());
  };

  const performanceGuard = () => {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const lowPower = Boolean(connection?.saveData || /2g/.test(connection?.effectiveType || ""));
    const app = $("#application");
    if (app && lowPower) app.classList.add("low-power-device");
    if (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches) {
      app?.classList.add("reduced-motion");
    }
  };

  const preventAccidentalZoom = () => {
    document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });
    document.addEventListener("gesturechange", event => event.preventDefault(), { passive: false });
    document.addEventListener("gestureend", event => event.preventDefault(), { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener("touchend", event => {
      const now = Date.now();
      if (now - lastTouchEnd <= 280) event.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  };

  const exposeAPI = () => {
    window.MISNexusApp = Object.freeze({
      notifications: Object.freeze({
        open: openNotifications,
        close: closeNotifications,
        toggle: toggleNotifications,
        add: addNotification,
        markRead: markNotificationRead,
        markAllRead: markAllNotificationsRead,
        getAll: readNotifications,
        unreadCount
      }),
      install: installManager,
      theme: Object.freeze({
        get: () => document.documentElement.dataset.theme || "silver",
        set: theme => {
          if (!APP.themes.includes(theme)) return false;
          localStorage.setItem(APP.themeKey, theme);
          applySupportedTheme();
          return true;
        }
      })
    });
  };

  const boot = () => {
    applySupportedTheme();
    updateBadge();
    footerClock();
    storeBadgeManager();
    addToastSystem();
    accessibility();
    performanceGuard();
    preventAccidentalZoom();
    exposeAPI();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
