<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MISBAHUL 'ILM SCHOOLS ABUJA — Staff Registration</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#10233f;--muted:#6b7a90;--line:#dce5f0;--accent:#1769e0;--accent2:#0f4eaa;--ok:#12834b;--bad:#c72d3d;--shadow:0 20px 55px #10233f18}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#eaf3ff,#f7f9fc 48%,#eef3f8);color:var(--ink);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:24px}.brand{text-align:center;margin:10px auto 24px}.brand img{width:86px;height:86px;object-fit:contain;border-radius:20px;background:#fff;box-shadow:var(--shadow)}h1{margin:12px 0 5px;font-size:clamp(24px,5vw,38px)}.sub{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:0 0 7px;font-size:14px}input,select{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px #1769e012}.hint{font-size:12px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.secondary{background:#edf3fb;color:var(--ink)}.status{margin-top:16px;padding:13px 15px;border-radius:14px;display:none}.status.show{display:block}.ok{background:#eaf8f1;color:var(--ok)}.bad{background:#fff0f2;color:var(--bad)}.loading{position:fixed;inset:0;background:#07182ecc;display:none;align-items:center;justify-content:center;z-index:9;color:#fff}.loading.show{display:flex}.loader{width:48px;height:48px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.wrap{padding:14px}.card{padding:18px;border-radius:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="loading" id="loading"><div><div class="loader"></div><p>Creating secure staff account…</p></div></div>
<main class="wrap">
<section class="brand"><img src="logo.png" alt="School logo" onerror="this.style.display='none'"><h1>MISBAHUL 'ILM SCHOOLS ABUJA</h1><div class="sub">MIS-NEXUS Staff Registration & Attendance Access</div></section>
<section class="card">
<form id="form" autocomplete="on">
<div class="grid">
<div><label>First name *</label><input id="firstName" required></div>
<div><label>Last name *</label><input id="lastName" required></div>
<div><label>Middle name</label><input id="middleName"></div>
<div><label>Staff number</label><input id="staffNumber"></div>
<div><label>School role *</label><select id="role" required><option value="">Loading roles…</option></select></div>
<div><label>Department</label><input id="department"></div>
<div><label>Phone</label><input id="phone" inputmode="tel"></div>
<div><label>Employment type</label><select id="employmentType"><option value="">Select</option><option value="full_time">Full time</option><option value="part_time">Part time</option><option value="contract">Contract</option><option value="temporary">Temporary</option><option value="intern">Intern</option><option value="volunteer">Volunteer</option><option value="other">Other</option></select></div>
<div class="full"><label>Direct staff photo URL</label><input id="photoUrl" type="url" placeholder="https://…/staff-photo.jpg"><div class="hint">Optional. Use the direct image link generated by your school photo-link tool.</div></div>
<div><label>Staff Gmail / login email *</label><input id="email" type="email" autocomplete="email" required></div>
<div><label>Login password *</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><div class="hint">At least 8 characters.</div></div>
<div><label>Six-digit attendance passcode *</label><input id="passcode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" required><div class="hint">Used inside the attendance dashboard after selecting the staff member.</div></div>
</div>
<div id="status" class="status"></div>
<div class="actions"><button class="btn primary" id="submit" type="submit">REGISTER STAFF</button><button class="btn secondary" type="button" onclick="location.href='staff-login.html'">STAFF LOGIN</button></div>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://ysjugqdcnbpzrqnvowpl.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_4IiL5xK5zv8C-VG7kNW92g_v1ghHlqx';
const EDGE_FUNCTION='staff-register';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
function status(msg,good=false){const e=$('status');e.textContent=msg;e.className='status show '+(good?'ok':'bad')}
async function roles(){const q=await sb.from('mis_nexus_staff_roles').select('role_name').eq('is_active',true).order('role_name');if(q.error)throw q.error;$('role').innerHTML='<option value="">Select role</option>'+(q.data||[]).map(x=>`<option value="${x.role_name}">${x.role_name.replace(/_/g,' ')}</option>`).join('')}
$('passcode').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!$('form').reportValidity())return;if($('passcode').value.length!==6)return status('Attendance passcode must contain exactly six digits.');
$('loading').classList.add('show');$('submit').disabled=true;
try{const body={first_name:$('firstName').value.trim(),middle_name:$('middleName').value.trim()||null,last_name:$('lastName').value.trim(),staff_number:$('staffNumber').value.trim()||null,role:$('role').value,department:$('department').value.trim()||null,phone:$('phone').value.trim()||null,employment_type:$('employmentType').value||null,photo_url:$('photoUrl').value.trim()||null,email:$('email').value.trim().toLowerCase(),password:$('password').value,passcode:$('passcode').value};const r=await fetch(`${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Registration failed.');if(data.session){await sb.auth.setSession(data.session)}status(`Registration successful. ${body.first_name} ${body.last_name} is now a permanent staff profile.`,true);setTimeout(()=>location.href='staff-dashboard.html',900)}catch(err){status(err.message||'Registration failed.')}finally{$('loading').classList.remove('show');$('submit').disabled=false}});
roles().catch(e=>{status('Could not load school roles: '+e.message)});
})();
</script>
</body></html>
