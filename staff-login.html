<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISBAHUL 'ILM SCHOOLS ABUJA — Staff Login</title><style>:root{--ink:#10233f;--muted:#718096;--line:#dce5f0;--blue:#1769e0;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#e8f3ff,#f7f9fc 55%,#edf2f7);font-family:Inter,system-ui;color:var(--ink)}.box{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 25px 70px #10233f1c;text-align:center}.logo{width:82px;height:82px;object-fit:contain;border-radius:18px}.sub{color:var(--muted);margin:5px 0 25px}label{text-align:left;display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;font-size:16px}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:18px;background:linear-gradient(135deg,#1769e0,#0f4eaa);color:white;font-weight:800;font-size:15px}.link{display:block;margin-top:16px;color:var(--blue);cursor:pointer}.msg{display:none;margin-top:15px;padding:12px;border-radius:12px}.msg.show{display:block}.bad{background:#fff0f2;color:#c72d3d}.load{display:none;margin-top:15px;color:var(--muted)}
</style></head><body><main class="box"><img class="logo" src="logo.png" alt="School logo"><h1>MISBAHUL 'ILM SCHOOLS ABUJA</h1><div class="sub">Staff Attendance Portal</div><form id="login"><label>Email / Gmail</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">LOGIN TO STAFF DASHBOARD</button></form><div id="load" class="load">Signing you in securely…</div><div id="msg" class="msg"></div><span class="link" onclick="location.href='staff-register.html'">Register as a new staff member</span></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const URL='https://ysjugqdcnbpzrqnvowpl.supabase.co',KEY='sb_publishable_4IiL5xK5zv8C-VG7kNW92g_v1ghHlqx',sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);$('login').onsubmit=async e=>{e.preventDefault();$('btn').disabled=true;$('load').style.display='block';$('msg').className='msg';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(r.error)throw r.error;const p=await sb.from('mis_nexus_staff_profiles').select('id,employment_status,is_attendance_enabled').eq('auth_user_id',r.data.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw new Error('This login has no staff profile. Please complete staff registration first.');if(p.data.employment_status!=='active')throw new Error('This staff account is not active.');if(p.data.is_attendance_enabled!==true)throw new Error('Attendance is disabled for this staff account.');location.href='staff-dashboard.html'}catch(err){$('msg').textContent=err.message||'Login failed.';$('msg').className='msg show bad'}finally{$('btn').disabled=false;$('load').style.display='none'}}})();</script></body></html>
