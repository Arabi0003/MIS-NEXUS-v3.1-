<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#08090b">

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="application-name"
  content="MIS-NEXUS™"
>

<meta
  name="apple-mobile-web-app-title"
  content="MIS-NEXUS™"
>

<title>MIS-NEXUS™ — Staff Attendance</title>

<link rel="manifest" href="manifest.json">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100dvh;
  overflow-x:hidden;
  background:#050608;
  color:#f5f6f7;
  font-family:
    Inter,
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  --accent:#d7dadd;
  --accent2:#ffffff;
  --muted:#858b94;
  --border:rgba(255,255,255,.12);
  --glass:rgba(18,21,25,.48);

  min-height:100dvh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,.10),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      #050608,
      #111419 50%,
      #060709
    );
}

#app::before{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.055),
      transparent 30%
    );

  filter:blur(40px);
}

.watermark{
  position:fixed;
  inset:0;
  z-index:1;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
  overflow:hidden;
}

.watermark img{
  width:min(92vw,760px);
  opacity:.055;

  filter:
    grayscale(1)
    brightness(1.5)
    contrast(.9);

  transform:
    perspective(900px)
    rotateX(12deg)
    rotateZ(-7deg);

  animation:
    watermarkFloat 9s ease-in-out infinite;
}

@keyframes watermarkFloat{

  0%,
  100%{
    transform:
      perspective(900px)
      rotateX(12deg)
      rotateZ(-7deg)
      translateY(0);
  }

  50%{
    transform:
      perspective(900px)
      rotateX(12deg)
      rotateZ(-7deg)
      translateY(-12px);
  }
}

.topbar{
  position:relative;
  z-index:5;

  min-height:76px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(14px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    12px
    max(18px,env(safe-area-inset-left));

  border-bottom:
    1px solid rgba(255,255,255,.06);

  background:
    rgba(5,7,9,.25);

  backdrop-filter:blur(16px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:40px;
  height:40px;
  object-fit:contain;
  border-radius:12px;
}

.brand strong{
  display:block;
  font-size:11px;
  letter-spacing:.14em;
}

.brand span{
  display:block;
  margin-top:3px;
  color:#707780;
  font-size:7px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.status-light{
  display:flex;
  align-items:center;
  gap:7px;

  color:#777e86;

  font-size:7px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.status-light i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#7d9b82;
  box-shadow:
    0 0 12px rgba(125,155,130,.7);
}

.main{
  position:relative;
  z-index:3;

  min-height:
    calc(
      100dvh - 76px
    );

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    35px
    18px
    max(30px,env(safe-area-inset-bottom));
}

.login-shell{
  width:min(100%,430px);
}

.logo-zone{
  display:flex;
  justify-content:center;
  margin-bottom:17px;
}

.logo-ring{
  width:108px;
  height:108px;

  display:grid;
  place-items:center;

  position:relative;

  border:
    1px solid rgba(255,255,255,.19);

  border-radius:50%;

  box-shadow:
    0 25px 55px rgba(0,0,0,.5),
    inset 0 0 25px rgba(255,255,255,.04);

  animation:
    logoPulse 5s ease-in-out infinite;
}

.logo-ring::before{
  content:"";
  position:absolute;
  inset:-9px;

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:50%;

  transform:
    rotateX(65deg);
}

.logo-ring img{
  width:76%;
  height:76%;
  object-fit:contain;

  filter:
    drop-shadow(
      0 12px 18px
      rgba(0,0,0,.65)
    );
}

@keyframes logoPulse{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }
}

.heading{
  text-align:center;
  margin-bottom:20px;
}

.heading h1{
  margin:0;

  font-size:
    clamp(
      17px,
      4.5vw,
      24px
    );

  letter-spacing:.03em;
}

.heading p{
  margin:7px 0 0;

  color:#747b84;

  font-size:8px;

  letter-spacing:.17em;

  text-transform:uppercase;
}

.card{
  position:relative;
  overflow:hidden;

  padding:22px;

  border:
    1px solid var(--border);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(34,38,43,.42),
      rgba(7,9,12,.45)
    );

  backdrop-filter:blur(20px);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5),
    inset 0 1px 0
      rgba(255,255,255,.07);
}

.card::before{
  content:"";
  position:absolute;
  left:14%;
  right:14%;
  top:0;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #d9dce0,
      transparent
    );

  opacity:.6;
}

.card-title{
  text-align:center;
  margin-bottom:18px;
}

.card-title strong{
  display:block;
  font-size:15px;
}

.card-title span{
  display:block;

  margin-top:5px;

  color:#737a83;

  font-size:8px;

  letter-spacing:.06em;
}

.field{
  margin-bottom:13px;
}

label{
  display:block;

  margin:
    0 0 7px 3px;

  color:#858c95;

  font-size:8px;

  font-weight:800;

  letter-spacing:.09em;

  text-transform:uppercase;
}

.input{
  width:100%;
  height:48px;

  padding:
    0 14px;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:14px;

  outline:none;

  color:#f2f3f4;

  background:
    rgba(4,6,8,.48);

  box-shadow:
    inset 0 2px 8px
      rgba(0,0,0,.3);

  transition:
    border-color .2s,
    box-shadow .2s;
}

.input:focus{
  border-color:
    rgba(255,255,255,.3);

  box-shadow:
    0 0 0 3px
      rgba(255,255,255,.04),
    inset 0 2px 8px
      rgba(0,0,0,.3);
}

.input::placeholder{
  color:#4e545b;
}

.email-lock{
  position:relative;
}

.email-lock::after{
  content:"AUTHORIZED";

  position:absolute;

  right:13px;
  top:50%;

  transform:translateY(-50%);

  color:#70777f;

  font-size:6px;

  letter-spacing:.1em;

  pointer-events:none;
}

.login-button{
  width:100%;
  height:50px;

  margin-top:4px;

  border:0;

  border-radius:15px;

  color:#101216;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #d8dadd 55%,
      #969ba1
    );

  font-size:10px;
  font-weight:900;

  letter-spacing:.12em;

  box-shadow:
    0 12px 30px
      rgba(0,0,0,.4),
    inset 0 1px 1px
      rgba(255,255,255,.9);

  transition:
    transform .15s,
    opacity .2s;
}

.login-button:active{
  transform:
    translateY(2px)
    scale(.99);
}

.login-button.loading{
  opacity:.65;
  pointer-events:none;
}

.spinner{
  width:17px;
  height:17px;

  display:none;

  margin:auto;

  border:
    2px solid
    rgba(0,0,0,.18);

  border-top-color:#101216;

  border-radius:50%;

  animation:
    spin .65s linear infinite;
}

.login-button.loading .button-label{
  display:none;
}

.login-button.loading .spinner{
  display:block;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.status{
  min-height:20px;

  margin-top:11px;

  text-align:center;

  color:#747c85;

  font-size:8px;

  line-height:1.5;
}

.status.error{
  color:#e19b9b;
}

.status.success{
  color:#a9c8af;
}

.security{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:6px;

  margin-top:14px;

  color:#535a62;

  font-size:7px;

  letter-spacing:.08em;

  text-transform:uppercase;
}

.security::before{
  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:#66746a;
}

.footer{
  text-align:center;

  margin-top:14px;

  color:#4e555d;

  font-size:7px;

  letter-spacing:.1em;

  text-transform:uppercase;
}

@media(max-height:700px){

  .main{
    align-items:flex-start;
    padding-top:18px;
  }

  .logo-ring{
    width:82px;
    height:82px;
  }

  .logo-zone{
    margin-bottom:9px;
  }

  .heading{
    margin-bottom:11px;
  }

  .card{
    padding:16px;
  }

  .field{
    margin-bottom:9px;
  }

  .input{
    height:42px;
  }

  .login-button{
    height:44px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}

</style>
</head>

<body>

<div id="app">

  <div class="watermark">
    <img
      src="institution.png"
      alt=""
      aria-hidden="true"
    >
  </div>

  <header class="topbar">

    <div class="brand">

      <img
        src="logo.png"
        alt="MISBAHUL 'ILM SCHOOLS ABUJA"
      >

      <div>
        <strong>MIS-NEXUS™</strong>
        <span>Staff Attendance System</span>
      </div>

    </div>

    <div class="status-light">
      <i></i>
      Secure Gateway
    </div>

  </header>


  <main class="main">

    <section class="login-shell">

      <div class="logo-zone">

        <div class="logo-ring">

          <img
            src="logo.png"
            alt="MIS-NEXUS"
          >

        </div>

      </div>


      <div class="heading">

        <h1>
          MISBAHUL 'ILM SCHOOLS ABUJA
        </h1>

        <p>
          Staff Attendance &amp; Location Gateway
        </p>

      </div>


      <form
        class="card"
        id="loginForm"
        autocomplete="on"
      >

        <div class="card-title">

          <strong>
            Staff Secure Login
          </strong>

          <span>
            Authorized staff access only
          </span>

        </div>


        <div class="field">

          <label for="email">
            Staff Email
          </label>

          <div class="email-lock">

            <input
              class="input"
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              value="staffs@gmail.com"
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="password">
            Secure Password
          </label>

          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

        </div>


        <button
          class="login-button"
          id="loginButton"
          type="submit"
        >

          <span class="button-label">
            ENTER STAFF ATTENDANCE
          </span>

          <span class="spinner"></span>

        </button>


        <div
          class="status"
          id="status"
          aria-live="polite"
        ></div>


        <div class="security">
          Protected Institutional Access
        </div>

      </form>


      <footer class="footer">
        MIS-NEXUS™ • MISBAHUL 'ILM SCHOOLS ABUJA
      </footer>

    </section>

  </main>

</div>


<script type="module">

"use strict";


/* ============================================================
   MIS-NEXUS™ STAFF AUTHENTICATION
   ============================================================ */

const SUPABASE_URL =
  "https://ysjugqdcnbpzrqnvowpl.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_4IiL5xK5zv8C-VG7kNW92g_v1ghHlqx";


const STAFF_EMAIL =
  "staffs@gmail.com";


let supabase = null;


const form =
  document.getElementById(
    "loginForm"
  );


const email =
  document.getElementById(
    "email"
  );


const password =
  document.getElementById(
    "password"
  );


const button =
  document.getElementById(
    "loginButton"
  );


const status =
  document.getElementById(
    "status"
  );


function setStatus(
  message,
  type = ""
){

  status.textContent =
    message;

  status.className =
    "status " + type;

}


function setLoading(
  loading
){

  button.classList.toggle(
    "loading",
    loading
  );

}


async function initializeSupabase(){

  try{

    const module =
      await import(
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      );


    supabase =
      module.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );


    return true;

  }catch(error){

    console.error(error);

    setStatus(
      "Secure authentication service is unavailable.",
      "error"
    );

    return false;

  }

}


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const enteredEmail =
      email.value
        .trim()
        .toLowerCase();


    const enteredPassword =
      password.value;


    if(
      enteredEmail !==
      STAFF_EMAIL
    ){

      setStatus(
        "This staff account is not authorized.",
        "error"
      );

      return;

    }


    if(!enteredPassword){

      setStatus(
        "Enter your password.",
        "error"
      );

      password.focus();

      return;

    }


    setLoading(true);

    setStatus(
      "Verifying secure staff credentials..."
    );


    try{

      if(!supabase){

        const ready =
          await initializeSupabase();

        if(!ready){

          throw new Error(
            "Authentication service unavailable."
          );

        }

      }


      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({

          email:
            STAFF_EMAIL,

          password:
            enteredPassword

        });


      if(error){

        throw error;

      }


      if(
        !data ||
        !data.user
      ){

        throw new Error(
          "Authentication could not be completed."
        );

      }


      setStatus(
        "Verifying staff access...",
        ""
      );


      const {
        data: staff,
        error: staffError
      } =
        await supabase

          .from(
            "mis_nexus_staff_profiles"
          )

          .select(
            "id,auth_user_id,email,full_name,role,employment_status,is_attendance_enabled"
          )

          .eq(
            "auth_user_id",
            data.user.id
          )

          .maybeSingle();


      if(staffError){

        console.error(
          staffError
        );

        await supabase.auth.signOut();

        throw new Error(
          "Staff access verification failed."
        );

      }


      if(!staff){

        await supabase.auth.signOut();

        throw new Error(
          "This authenticated account is not registered in the Staff Attendance System."
        );

      }


      if(
        staff.employment_status !==
        "active"
      ){

        await supabase.auth.signOut();

        throw new Error(
          "This staff account is currently inactive."
        );

      }


      if(
        staff.is_attendance_enabled !==
        true
      ){

        await supabase.auth.signOut();

        throw new Error(
          "Attendance access is disabled for this staff account."
        );

      }


      sessionStorage.setItem(
        "MIS_NEXUS_STAFF_ID",
        staff.id
      );


      sessionStorage.setItem(
        "MIS_NEXUS_STAFF_ROLE",
        staff.role
      );


      setStatus(
        "Access verified. Opening Staff Attendance...",
        "success"
      );


      window.location.replace(
        "staff-dashboard.html"
      );


    }catch(error){

      console.error(
        "MIS-NEXUS Staff Login:",
        error
      );


      setStatus(
        "Invalid email or password, or staff access is not authorized.",
        "error"
      );

    }finally{

      setLoading(false);

    }

  }
);


initializeSupabase();

</script>

</body>
</html>
