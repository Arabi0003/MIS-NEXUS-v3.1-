<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="transparent"
>

<title>MIS-NEXUS | Classes</title>

<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   MIS-NEXUS CLASSES.HTML
   =========================================================
   
   DESIGN PRINCIPLES
   
   1. BODY IS 100% TRANSPARENT.
   2. NO BACKDROP BLUR.
   3. NO BACKGROUND OVERLAY.
   4. BACKGROUND IMAGE IS FULLY VISIBLE.
   5. SILVER 3D CONTROLS.
   6. RESPONSIVE.
   7. FAST AUTHENTICATION.
   8. NO INFINITE LOADING.
   ========================================================= */


/* =========================================================
   VARIABLES
   ========================================================= */

:root {

    --silver-1: #ffffff;
    --silver-2: #eeeeee;
    --silver-3: #c8c8c8;
    --silver-4: #999999;
    --silver-5: #666666;
    --silver-6: #3d3d3d;

    --white: #ffffff;

    --success: #8cffb0;
    --error: #ff7777;

    --radius: 18px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}


html {
    width: 100%;
    min-height: 100%;
    background: transparent !important;
}


body {

    width: 100%;
    min-height: 100vh;

    /*
       IMPORTANT:
       The page itself is completely transparent.
    */

    background: transparent !important;

    color: var(--white);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   REAL IMAGE BACKGROUND
   =========================================================
   
   Replace ./background.jpg with your existing background
   image filename/path if different.
   ========================================================= */

#imageBackground {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: -100;

    background-image: url("./background.jpg");

    background-position: center center;

    background-repeat: no-repeat;

    background-size: cover;

    /*
       FULL IMAGE VISIBILITY
       
       No blur.
       No opacity.
       No filter.
    */

    opacity: 1;

    filter: none;

    pointer-events: none;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px 16px;

    /*
       ABSOLUTELY TRANSPARENT
    */

    background: transparent !important;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

    width: min(440px, 100%);

    display: flex;

    flex-direction: column;

    align-items: center;

    /*
       NO PANEL BACKGROUND
    */

    background: transparent !important;

    box-shadow: none;

    border: none;
}


/* =========================================================
   SILVER LOGO CIRCLE
   ========================================================= */

.logo {

    width: 112px;

    height: 112px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    margin-bottom: 16px;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #eeeeee 18%,
            #bbbbbb 42%,
            #eeeeee 64%,
            #777777 100%
        );

    border: 3px solid #ffffff;

    /*
       Thick 3D silver edge
    */

    box-shadow:

        0 4px 0 #555555,

        0 8px 16px rgba(0,0,0,.45),

        inset 0 3px 4px rgba(255,255,255,.95),

        inset 0 -5px 7px rgba(0,0,0,.35);
}


.logo img {

    width: 82%;

    height: 82%;

    object-fit: contain;

    filter:
        drop-shadow(0 3px 0 #555)
        drop-shadow(0 6px 7px rgba(0,0,0,.5));
}


/* =========================================================
   BRAND
   ========================================================= */

.title {

    font-size: clamp(28px, 7vw, 40px);

    font-weight: 950;

    letter-spacing: .08em;

    text-align: center;

    color: #ffffff;

    text-shadow:

        0 3px 0 #555555,

        0 6px 12px rgba(0,0,0,.65);
}


.subtitle {

    margin-top: 5px;

    margin-bottom: 20px;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: .15em;

    text-transform: uppercase;

    color: rgba(255,255,255,.9);

    text-shadow:

        0 2px 5px rgba(0,0,0,.9);
}


/* =========================================================
   LOGIN CAT
   ========================================================= */

.cat {

    width: 155px;

    height: 155px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 13px;

    background: transparent !important;
}


.cat img {

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

    /*
       THICK 3D CAT
    */

    filter:

        drop-shadow(0 5px 0 #444444)

        drop-shadow(0 8px 0 #777777)

        drop-shadow(0 13px 17px rgba(0,0,0,.65));

    transition:
        transform .2s ease,
        filter .2s ease;
}


.cat img:hover {

    transform:
        translateY(-3px)
        scale(1.02);

    filter:

        drop-shadow(0 6px 0 #444444)

        drop-shadow(0 10px 0 #777777)

        drop-shadow(0 15px 19px rgba(0,0,0,.65));
}


/* =========================================================
   LOGIN FORM
   ========================================================= */

.login-form {

    width: 100%;

    background: transparent !important;

    border: none;

    box-shadow: none;
}


/* =========================================================
   FIELD
   ========================================================= */

.field {

    width: 100%;

    margin-bottom: 15px;
}


.field label {

    display: block;

    margin-bottom: 7px;

    margin-left: 3px;

    font-size: 13px;

    font-weight: 850;

    color: #ffffff;

    text-shadow:

        0 2px 5px rgba(0,0,0,.9);
}


/* =========================================================
   INPUT
   ========================================================= */

.input {

    width: 100%;

    height: 55px;

    padding:
        0 16px;

    border-radius: var(--radius);

    /*
       The input itself is transparent.
    */

    background: transparent !important;

    border: 2px solid rgba(255,255,255,.95);

    outline: none;

    color: #ffffff;

    font-size: 16px;

    font-weight: 650;

    box-shadow:

        0 4px 0 #555555,

        0 7px 13px rgba(0,0,0,.4),

        inset 0 2px 3px rgba(255,255,255,.3);

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.input::placeholder {

    color: rgba(255,255,255,.78);
}


.input:focus {

    border-color: #ffffff;

    box-shadow:

        0 4px 0 #555555,

        0 0 0 2px rgba(255,255,255,.25),

        0 8px 16px rgba(0,0,0,.5),

        inset 0 2px 3px rgba(255,255,255,.35);
}


/* =========================================================
   PASSWORD WRAPPER
   ========================================================= */

.password-box {

    position: relative;

    width: 100%;
}


.password-box .input {

    padding-right: 52px;
}


.eye {

    position: absolute;

    right: 9px;

    top: 50%;

    transform: translateY(-50%);

    width: 38px;

    height: 38px;

    border: none;

    background: transparent;

    color: #ffffff;

    cursor: pointer;

    font-size: 18px;

    text-shadow:
        0 2px 4px rgba(0,0,0,.7);
}


/* =========================================================
   SILVER LOGIN BUTTON
   ========================================================= */

.login-button {

    width: 100%;

    height: 57px;

    margin-top: 5px;

    border-radius: var(--radius);

    border: 2px solid #ffffff;

    cursor: pointer;

    color: #202020;

    font-size: 16px;

    font-weight: 950;

    letter-spacing: .08em;

    text-transform: uppercase;

    background:

        linear-gradient(
            180deg,
            #ffffff 0%,
            #eeeeee 20%,
            #c6c6c6 52%,
            #8c8c8c 100%
        );

    box-shadow:

        0 5px 0 #555555,

        0 9px 15px rgba(0,0,0,.5),

        inset 0 3px 3px rgba(255,255,255,.95),

        inset 0 -5px 7px rgba(0,0,0,.25);

    transition:

        transform .1s ease,

        box-shadow .1s ease,

        opacity .2s ease;
}


.login-button:hover {

    background:

        linear-gradient(
            180deg,
            #ffffff,
            #f1f1f1,
            #bdbdbd
        );
}


.login-button:active {

    transform: translateY(4px);

    box-shadow:

        0 1px 0 #555555,

        0 4px 8px rgba(0,0,0,.4);
}


.login-button:disabled {

    cursor: wait;

    opacity: .65;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    min-height: 25px;

    margin-top: 14px;

    text-align: center;

    font-size: 13px;

    font-weight: 750;

    line-height: 1.5;

    text-shadow:

        0 2px 5px rgba(0,0,0,.95);
}


.status.error {

    color: var(--error);
}


.status.success {

    color: var(--success);
}


/* =========================================================
   LOADING
   ========================================================= */

.spinner {

    display: inline-block;

    width: 13px;

    height: 13px;

    margin-left: 7px;

    vertical-align: -2px;

    border-radius: 50%;

    border: 2px solid rgba(0,0,0,.25);

    border-top-color: #111111;

    animation:
        spin .7s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top: 20px;

    text-align: center;

    color: rgba(255,255,255,.78);

    font-size: 11px;

    font-weight: 650;

    text-shadow:

        0 2px 5px rgba(0,0,0,.9);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 480px) {

    .page {

        padding:
            18px 14px 25px;
    }

    .logo {

        width: 98px;

        height: 98px;
    }

    .cat {

        width: 125px;

        height: 125px;
    }

    .title {

        font-size: 29px;
    }

    .subtitle {

        margin-bottom: 15px;
    }

    .input {

        height: 53px;
    }

    .login-button {

        height: 55px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     IMAGE-BASED BACKGROUND
     ========================================================= -->

<div id="imageBackground"></div>


<!-- =========================================================
     PAGE
     ========================================================= -->

<main class="page">

    <section class="container">


        <!-- =================================================
             SILVER LOGO
             ================================================= -->

        <div class="logo">

            <img
                src="./logo.png"
                alt="MIS-NEXUS"
            >

        </div>


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1 class="title">
            MIS-NEXUS
        </h1>


        <p class="subtitle">
            Class Management Portal
        </p>


        <!-- =================================================
             LOGIN CAT
             ================================================= -->

        <div class="cat">

            <img
                src="./login-cat.png"
                alt="MIS-NEXUS Login"
            >

        </div>


        <!-- =================================================
             LOGIN FORM
             ================================================= -->

        <form
            id="loginForm"
            class="login-form"
            autocomplete="on"
        >


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Class Email
                </label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    name="email"
                    autocomplete="username"
                    inputmode="email"
                    placeholder="Enter class email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        class="input"
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        id="eyeButton"
                        class="eye"
                        type="button"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                Sign In
            </button>


            <!-- STATUS -->

            <div
                id="status"
                class="status"
                aria-live="polite"
            ></div>


        </form>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="footer">
            MIS-NEXUS • Secure Class Access
        </div>


    </section>

</main>



<script>

/* =========================================================
   MIS-NEXUS AUTHENTICATION
   ========================================================= */


/*
   =========================================================
   SUPABASE CONFIGURATION
   =========================================================

   Put your Supabase PROJECT URL here.

   Put your PUBLIC ANON KEY here.

   NEVER put the SERVICE ROLE KEY in this HTML file.
   =========================================================
*/

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";


const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


try {

    if (
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"
    ) {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY,
                {
                    auth: {

                        persistSession: true,

                        autoRefreshToken: true,

                        detectSessionInUrl: true

                    }
                }
            );

    }

} catch (error) {

    console.error(
        "Supabase initialization failed:",
        error
    );

}


/* =========================================================
   DOM
   ========================================================= */

const form =
    document.getElementById("loginForm");


const email =
    document.getElementById("email");


const password =
    document.getElementById("password");


const button =
    document.getElementById("loginButton");


const status =
    document.getElementById("status");


const eye =
    document.getElementById("eyeButton");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message,
    type = ""
) {

    status.className = "status";

    if (type) {

        status.classList.add(type);

    }

    status.textContent = message;
}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(
    loading
) {

    button.disabled =
        loading;

    email.disabled =
        loading;

    password.disabled =
        loading;


    if (loading) {

        button.innerHTML =
            'Verifying <span class="spinner"></span>';

    } else {

        button.textContent =
            "Sign In";

    }

}


/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

eye.addEventListener(
    "click",
    function () {

        const isPassword =
            password.type === "password";


        password.type =
            isPassword
                ? "text"
                : "password";


        eye.textContent =
            isPassword
                ? "🙈"
                : "👁";

    }
);


/* =========================================================
   TIMEOUT
   =========================================================
   
   Prevents the application from appearing frozen.
   ========================================================= */

function timeout(
    promise,
    milliseconds = 15000
) {

    return Promise.race([

        promise,

        new Promise(
            (_, reject) => {

                setTimeout(
                    () => {

                        reject(
                            new Error(
                                "The server did not respond within 15 seconds."
                            )
                        );

                    },
                    milliseconds
                );

            }
        )

    ]);

}


/* =========================================================
   VERIFY CLASS
   ========================================================= */

async function verifyClass(
    user
) {

    if (!user) {

        throw new Error(
            "No authenticated user was returned."
        );

    }


    if (!user.id) {

        throw new Error(
            "The authenticated account has no UUID."
        );

    }


    console.log(
        "MIS-NEXUS authenticated UUID:",
        user.id
    );


    /*
       Call the database function created for MIS-NEXUS.

       The function uses:

           auth.uid()

       and therefore automatically checks the currently
       authenticated Supabase account.
    */

    const response =
        await timeout(

            supabaseClient.rpc(
                "mis_nexus_get_my_class"
            ),

            15000

        );


    if (response.error) {

        console.error(
            "Class RPC error:",
            response.error
        );

        throw new Error(
            response.error.message ||
            "Unable to verify the class account."
        );

    }


    const rows =
        response.data || [];


    if (
        !Array.isArray(rows) ||
        rows.length === 0
    ) {

        throw new Error(
            "This account is authenticated but is not linked to an active class."
        );

    }


    /*
       Find the row whose user_id equals
       the authenticated Supabase UUID.
    */

    const account =
        rows.find(
            row =>
                String(row.user_id).toLowerCase() ===
                String(user.id).toLowerCase()
        );


    if (!account) {

        throw new Error(
            "The authenticated UUID does not match the class account."
        );

    }


    if (
        account.status &&
        account.status.toLowerCase() !== "active"
    ) {

        throw new Error(
            "This class account is not active."
        );

    }


    return account;

}


/* =========================================================
   SAVE CLASS SESSION
   ========================================================= */

function saveClass(
    user,
    account
) {

    /*
       Only non-sensitive information is stored.

       NEVER store the password.
    */

    sessionStorage.setItem(
        "mis_nexus_class",
        JSON.stringify({

            user_id:
                user.id,

            class_id:
                account.class_id,

            class_key:
                account.class_key,

            class_name:
                account.class_name,

            email:
                account.email,

            status:
                account.status

        })
    );

}


/* =========================================================
   LOGIN
   ========================================================= */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        setStatus("");


        const userEmail =
            email.value
                .trim()
                .toLowerCase();


        const userPassword =
            password.value;


        /* -----------------------------------------------
           BASIC VALIDATION
           ----------------------------------------------- */

        if (!userEmail) {

            setStatus(
                "Please enter the class email.",
                "error"
            );

            email.focus();

            return;

        }


        if (!userEmail.includes("@")) {

            setStatus(
                "Please enter a valid email address.",
                "error"
            );

            email.focus();

            return;

        }


        if (!userPassword) {

            setStatus(
                "Please enter the class password.",
                "error"
            );

            password.focus();

            return;

        }


        /* -----------------------------------------------
           SUPABASE CHECK
           ----------------------------------------------- */

        if (!supabaseClient) {

            setStatus(
                "Supabase is not configured. Check the project URL and anon key.",
                "error"
            );

            return;

        }


        setLoading(true);


        try {


            /* ============================================
               STEP 1 — SUPABASE AUTHENTICATION
               ============================================ */

            setStatus(
                "Connecting to secure authentication…"
            );


            const login =
                await timeout(

                    supabaseClient.auth.signInWithPassword({

                        email:
                            userEmail,

                        password:
                            userPassword

                    }),

                    15000

                );


            if (login.error) {

                console.error(
                    "Authentication error:",
                    login.error
                );

                throw new Error(
                    login.error.message ||
                    "Authentication failed."
                );

            }


            const user =
                login.data.user;


            const session =
                login.data.session;


            if (!user || !session) {

                throw new Error(
                    "Authentication completed without a valid session."
                );

            }


            console.log(
                "Authentication successful:",
                user.id
            );


            /* ============================================
               STEP 2 — CLASS VERIFICATION
               ============================================ */

            setStatus(
                "Verifying class account…"
            );


            const account =
                await verifyClass(
                    user
                );


            console.log(
                "Class verified:",
                account
            );


            /* ============================================
               STEP 3 — SAVE CLASS INFORMATION
               ============================================ */

            saveClass(
                user,
                account
            );


            /* ============================================
               STEP 4 — SUCCESS
               ============================================ */

            setStatus(
                `Verified: ${account.class_name}`,
                "success"
            );


            /*
               Store the class key separately so your
               dashboard can use it immediately.
            */

            sessionStorage.setItem(
                "mis_nexus_class_key",
                account.class_key
            );


            /*
               Redirect to the existing class dashboard.

               CHANGE ONLY THIS PATH if your dashboard has
               another filename.
            */

            setTimeout(
                function () {

                    window.location.href =
                        "./class-dashboard.html";

                },
                400
            );


        } catch (error) {


            console.error(
                "MIS-NEXUS LOGIN ERROR:",
                error
            );


            let message =
                error?.message ||
                "Unable to verify the class account.";


            /* --------------------------------------------
               FRIENDLY AUTH ERRORS
               -------------------------------------------- */

            const lower =
                message.toLowerCase();


            if (
                lower.includes(
                    "invalid login credentials"
                )
            ) {

                message =
                    "Incorrect class email or password.";

            }


            else if (
                lower.includes(
                    "email not confirmed"
                )
            ) {

                message =
                    "This Supabase account has not been confirmed.";

            }


            else if (
                lower.includes(
                    "15 seconds"
                )
            ) {

                message =
                    "The connection timed out. Please check the Supabase connection and try again.";

            }


            setStatus(
                message,
                "error"
            );


        } finally {


            /*
               CRITICAL:
               The interface NEVER remains permanently
               disabled after an error.
            */

            setLoading(false);

        }

    }
);


/* =========================================================
   SESSION RESTORATION
   ========================================================= */

async function restoreSession() {

    if (!supabaseClient) {

        return;

    }


    try {

        const result =
            await timeout(

                supabaseClient.auth.getSession(),

                8000

            );


        if (result.error) {

            console.warn(
                "Session error:",
                result.error
            );

            return;

        }


        const session =
            result.data?.session;


        if (!session) {

            return;

        }


        /*
           We have an existing authenticated session.
           Verify it before redirecting.
        */

        const account =
            await verifyClass(
                session.user
            );


        saveClass(
            session.user,
            account
        );


        /*
           Uncomment if you want an already-authenticated
           class to automatically enter the dashboard.

        window.location.href =
            "./class-dashboard.html";
        */


    } catch (error) {

        console.warn(
            "Session restoration:",
            error
        );

    }

}


/* =========================================================
   START
   ========================================================= */

restoreSession();

</script>

</body>
</html>
